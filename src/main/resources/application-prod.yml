# ==============================
# 1. Spring Boot 监控配置
# ==============================
management:
  endpoints:
    web:
      # 暴露监控接口，给 Prometheus 采集数据
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      # 生产环境显示服务健康状态
      show-details: when-authorized
  metrics:
    tags:
      # 监控指标里标记应用名称
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        # 开启 Prometheus 监控导出
        enabled: true

# ==============================
# 2. Spring 核心配置
# ==============================
spring:
  # MySQL 数据库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.21.254.15:3306/qisi_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: user1
    password: Mysql@2026
    # 生产环境数据库连接池优化
    hikari:
      maximum-pool-size: 10       # 最大连接数
      minimum-idle: 5             # 最小空闲连接
      idle-timeout: 300000        # 空闲连接超时
      connection-timeout: 10000   # 获取连接超时

  # Redis 配置
  data:
    redis:
      host: 172.21.254.15
      port: 6379
      password: Redis@2026
      lettuce:
        pool:
          max-active: 10          # 最大连接数
          max-idle: 10           # 最大空闲连接
          min-idle: 2            # 最小空闲连接
          time-between-eviction-runs: 10s

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      resolve-lazily: true        # 懒加载，节省内存

  # 生产环境关闭彩色日志
  output:
    ansi:
      enabled: never

# ==============================
# 3. JWT 登录认证（生产安全配置）
# ==============================
jwt:
  secret: 7sK9$pR2!vG5^nQ8&bT1*dF6@hJ3%mL0#cX7
  access-token-ttl: 900000        # 15分钟 访问令牌

token:
  refresh-token-ttl: 12          # 12小时 刷新令牌

session:
  mapping-ttl-hours: 1           # 会话有效期

# ==============================
# 4. MyBatis-Plus 生产配置
# ==============================
mybatis-plus:
  configuration:
    # 生产环境关闭 SQL 日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false                # 关闭启动横幅
    db-config:
      id-type: ASSIGN_ID          # 主键雪花算法

# ==============================
# 5. 日志配置
# ==============================
logging:
  level:
    root: INFO
    com.sc.qisisystem: INFO
    org.springframework: INFO
    org.springframework.web: INFO
    org.apache.catalina: WARN
    com.zaxxer.hikari: WARN
  file:
    name: ./logs/qisi.log         # 日志文件路径
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 15             # 生产保留15天日志足够

# ==============================
# 6. MinIO 对象存储
# ==============================
minio:
  endpoint: http://172.21.254.15:9000
  access-key: admin
  secret-key: Minio@2026
  read-timeout: 6000
  connect-timeout: 6000
  write-timeout: 6000
  bucket:
    avatar: qisi-system-avatar
    attachment: qisi-system-attachment

# ==============================
# 7. 验证码配置
# ==============================
captcha:
  width: 120
  height: 40
  length: 4
  ttl: 60          # 有效期60秒
  ip-lock-ttl: 3   # 输错3次锁定IP