spring:
  # 数据库连接配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.21.254.15:3306/qisi_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: user1
    password: Mysql@2026

  # Redis 基础配置
  data:
    redis:
      host: 172.21.254.15
      port: 6379
      password: Redis@2026
      lettuce:
        pool:
          max-active: 10
          maxIdle: 10
          minIdle: 1
          time-between-eviction-runs: 10s

  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB

  output:
    ansi:
      enabled: always


jwt:
  secret: 7sK9$pR2!vG5^nQ8&bT1*dF6@hJ3%mL0#cX7          # 密钥
  access-token-ttl: 900000                              # Token 有效期：15分钟

token:
  refresh-token-ttl: 12      #小时

session:
  mapping-ttl-hours: 1


# MyBatis-Plus配置
mybatis-plus:
  configuration:
    # 开启MyBatis-Plus日志
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      # 主键生成策略（雪花算法/自增等）
      id-type: ASSIGN_ID

logging:
  level:
    root: INFO
    com.sc.qisisystem: INFO
    org.springframework: INFO
    org.springframework.web: INFO
    org.springframework.boot: INFO
    org.apache.catalina: WARN
    org.mybatis: INFO
    com.baomidou.mybatis: INFO
    io.lettuce.core: INFO
    com.zaxxer.hikari: WARN
  file:
    name: ./logs/qisi.log        # 日志文件路径
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-40.40logger{39}){cyan} : %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30


# MinIO 对象存储配置
minio:
  endpoint: http://172.21.254.15:9000       # MinIO服务端地址
  access-key: admin                   # 访问密钥（对应MinIO的账号）
  secret-key: Minio@2026               # 秘钥（对应MinIO的密码）
  read-timeout: 6000                    # 读取超时时间（毫秒）
  connect-timeout: 6000                 # 连接超时时间（毫秒）
  write-timeout: 6000
  bucket:
    avatar: qisi-system-avatar           # 头像桶
    attachment: qisi-system-attachment   # 附件桶


captcha:
  width: 120
  height: 40
  length: 4
  ttl: 60
  ip-lock-ttl: 3