name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "target/*.jar"
          target: "/opt/qisi/project"

      - name: Restart Docker container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
              cd /opt/qisi/project
              # 只取刚上传的、带 SNAPSHOT 或最新的 jar（更稳）
              JAR_NAME=$(ls -t *.jar | head -1)
              # 停删旧容器
              docker stop QiSi-System || true
              docker rm QiSi-System || true
              # 启动：推荐用 bridge + 端口映射，比 host 安全
              docker run -d \
                --name QiSi-System \
                -p 8080:8080 \
                -e SPRING_PROFILES_ACTIVE=prod \
                --restart=always \
                1panel/java:17 \
                java -jar /opt/qisi/project/$JAR_NAME
